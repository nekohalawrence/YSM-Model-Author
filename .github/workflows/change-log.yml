name: Auto Update Changelog

concurrency:
  group: readme-auto-updates-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths: ['models/**']
  workflow_dispatch:

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate changelog entries for changed author folders
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import os
          import re
          import subprocess
          from datetime import date

          readme_paths = ['README.md', 'README-EN.md']
          models_dir = 'models'
          start_marker = '<!-- CHANGELOG_AUTOGEN_START -->'
          end_marker = '<!-- CHANGELOG_AUTOGEN_END -->'
          auto_marker = '<!-- AUTO_LOGS_START -->'
          manual_marker = '<!-- MANUAL_LOGS_START -->'

          for readme_path in readme_paths:
              if not os.path.isfile(readme_path):
                  raise SystemExit(f'Readme not found: {readme_path}')

          env_before = os.getenv('GITHUB_EVENT_BEFORE', '')
          env_sha = os.getenv('GITHUB_SHA', '')
          event_path = os.getenv('GITHUB_EVENT_PATH', '')
          changed_entries = []

          if event_path and os.path.isfile(event_path):
              try:
                  import json
                  with open(event_path, 'r', encoding='utf-8') as event_file:
                      event_data = json.load(event_file)
                  commits = event_data.get('commits', [])
                  for commit in commits:
                      for path in commit.get('added', []):
                          changed_entries.append(f'A\t{path}')
                      for path in commit.get('modified', []):
                          changed_entries.append(f'M\t{path}')
                      for path in commit.get('removed', []):
                          changed_entries.append(f'D\t{path}')
              except Exception:
                  changed_entries = []

          def normalize_git_path(path):
              path = path.strip()
              if path.startswith('"') and path.endswith('"'):
                  path = path[1:-1]
              return path.replace('\\', '/')
 
          if not changed_entries and env_before and env_sha and env_before != '0000000000000000000000000000000000000000':
              proc = subprocess.run(['git', 'diff', '--name-status', env_before, env_sha], capture_output=True, text=True, check=True)
              for line in proc.stdout.splitlines():
                  if not line.strip():
                      continue
                  parts = line.strip().split('\t')
                  if len(parts) < 2:
                      continue
                  status = parts[0]
                  path = normalize_git_path(parts[-1])
                  changed_entries.append(f'{status}\t{path}')
 
          if not changed_entries:
              print('No changed files detected for this push. Nothing to update.')
              raise SystemExit(0)

          def file_category(path):
              ext = os.path.splitext(path)[1].lower()
              if ext in {'.ysm', '.zip', '.7z', '.rar', '.tar', '.gz'}:
                  return 'model'
              if ext in {'.md'}:
                  return 'readme'
              if ext in {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.bmp'}:
                  return 'image'
              return 'other'

          changed_authors = {}
          for entry in changed_entries:
              parts = entry.split('\t')
              if len(parts) < 2:
                  continue
              status, path = parts[0], parts[-1]
              normalized = path.replace('\\', '/')
              path_parts = normalized.split('/')
              if len(path_parts) >= 2 and path_parts[0] == models_dir and re.fullmatch(r'\d{4}', path_parts[1]):
                  folder = path_parts[1]
                  info = changed_authors.setdefault(folder, {
                      'added': 0,
                      'modified': 0,
                      'deleted': 0,
                      'model': 0,
                      'readme': 0,
                      'image': 0,
                      'other': 0,
                  })
                  if status == 'A':
                      info['added'] += 1
                  elif status == 'M':
                      info['modified'] += 1
                  elif status == 'D':
                      info['deleted'] += 1
                  else:
                      info['modified'] += 1
                  info[file_category(path)] += 1

          if not changed_authors:
              print('No changed author folders detected. Nothing to update.')
              raise SystemExit(0)

          def find_author_name(folder):
              folder_path = os.path.join(models_dir, folder)
              if not os.path.isdir(folder_path):
                  return None
              for candidate in ['README.md', 'readme.md', 'Readme.md']:
                  candidate_path = os.path.join(folder_path, candidate)
                  if os.path.isfile(candidate_path):
                      text = open(candidate_path, 'r', encoding='utf-8', errors='ignore').read()
                      match = re.search(r'-\s*作者名称\s*[:：]\s*(.+?)(?:\n|$)', text)
                      if match:
                          return match.group(1).strip()
                      break
              return None

          new_entries_zh = []
          new_entries_en = []
          for folder in sorted(changed_authors):
              author_name = find_author_name(folder) or folder
              author_text = author_name.replace('|', '\\|')
              stats = changed_authors[folder]

              zh_details = []
              en_details = []
              if stats['model']:
                  zh_details.append(f"{stats['model']} 个模型文件")
                  en_details.append(f"{stats['model']} model file{'s' if stats['model'] != 1 else ''}")
              if stats['readme']:
                  zh_details.append(f"{stats['readme']} 个 README")
                  en_details.append(f"{stats['readme']} README file{'s' if stats['readme'] != 1 else ''}")
              if stats['image']:
                  zh_details.append(f"{stats['image']} 张预览图")
                  en_details.append(f"{stats['image']} preview image{'s' if stats['image'] != 1 else ''}")
              if stats['other']:
                  zh_details.append(f"{stats['other']} 个其他文件")
                  en_details.append(f"{stats['other']} other file{'s' if stats['other'] != 1 else ''}")

              zh_status = []
              en_status = []
              if stats['added']:
                  zh_status.append(f"新增 {stats['added']}")
                  en_status.append(f"added {stats['added']}")
              if stats['modified']:
                  zh_status.append(f"更新 {stats['modified']}")
                  en_status.append(f"modified {stats['modified']}")
              if stats['deleted']:
                  zh_status.append(f"删除 {stats['deleted']}")
                  en_status.append(f"deleted {stats['deleted']}")

              zh_summary = '、'.join(zh_details) if zh_details else '若干文件'
              if zh_status:
                  zh_summary += f"（{'，'.join(zh_status)}）"
              en_summary = ', '.join(en_details) if en_details else 'several files'
              if en_status:
                  en_summary += f" ({', '.join(en_status)})"

              entry_base = f"- chore: models/{folder}: [#{folder} - {author_text}](.../../{models_dir}/{folder})"
              new_entries_zh.append(f"{entry_base} - 更新了 {zh_summary}")
              new_entries_en.append(f"{entry_base} - updated {en_summary}")

          if not new_entries_zh:
              print('No author names could be determined for changed folders. Nothing to update.')
              raise SystemExit(0)

          today = date.today().isoformat()

          file_updates = {
              'README.md': new_entries_zh,
              'README-EN.md': new_entries_en,
          }

          for readme_path, new_entries in file_updates.items():
              with open(readme_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              if start_marker not in content or end_marker not in content:
                  raise SystemExit(f'Change log markers not found in {readme_path}')

              prefix, rest = content.split(start_marker, 1)
              block, suffix = rest.split(end_marker, 1)

              def parse_sections(block_text):
                  pre_heading_lines = []
                  sections = []
                  current_heading = None
                  current_lines = []
                  for line in block_text.splitlines():
                      if line.startswith('# '):
                          if current_heading is not None:
                              sections.append((current_heading, current_lines))
                          else:
                              if current_lines:
                                  pre_heading_lines.extend(current_lines)
                          current_heading = line.strip()
                          current_lines = []
                      else:
                          if current_heading is not None:
                              current_lines.append(line)
                          else:
                              pre_heading_lines.append(line)
                  if current_heading is not None:
                      sections.append((current_heading, current_lines))

                  merged = []
                  heading_to_index = {}
                  for heading, lines in sections:
                      if heading in heading_to_index:
                          idx = heading_to_index[heading]
                          if merged[idx][1] and lines:
                              merged[idx][1].append('')
                          merged[idx][1].extend(lines)
                      else:
                          heading_to_index[heading] = len(merged)
                          merged.append([heading, list(lines)])
                  return pre_heading_lines, [(heading, lines) for heading, lines in merged]

              def split_section_lines(lines):
                  auto_lines = []
                  manual_lines = []
                  state = 'manual'
                  for line in lines:
                      if line.strip() == auto_marker:
                          state = 'auto'
                          continue
                      if line.strip() == manual_marker:
                          state = 'manual'
                          continue
                      if state == 'auto':
                          auto_lines.append(line)
                      else:
                          manual_lines.append(line)
                  return auto_lines, manual_lines

              def dedupe_lines(lines):
                  seen = set()
                  out = []
                  for line in lines:
                      if line not in seen:
                          seen.add(line)
                          out.append(line)
                  return out

              pre_heading_lines, sections = parse_sections(block)
              updated = False
              new_sections = []
              today_found = False
              today_heading = f'# {today}'
              for heading, lines in sections:
                  if heading == today_heading:
                      auto_lines, manual_lines = split_section_lines(lines)
                      combined_auto = dedupe_lines(auto_lines + new_entries)
                      new_lines = [auto_marker]
                      if combined_auto:
                          new_lines.extend(combined_auto)
                      new_lines.extend(['', manual_marker])
                      if manual_lines:
                          new_lines.extend(manual_lines)
                      new_sections.append((heading, new_lines))
                      today_found = True
                      updated = True
                  else:
                      new_sections.append((heading, lines))

              if not today_found:
                  new_sections.append((today_heading, [auto_marker] + new_entries + ['', manual_marker]))
                  updated = True

              new_sections.sort(key=lambda item: item[0], reverse=True)

              def render_sections(sections_list, pre_lines):
                  lines = []
                  if pre_lines:
                      lines.extend(pre_lines)
                      lines.append('')
                  for heading, section_lines in sections_list:
                      if not section_lines:
                          lines.extend([heading, ''])
                          continue
                      lines.extend([heading, ''])
                      lines.extend(section_lines)
                      lines.append('')
                  return '\n'.join(lines).rstrip() + '\n'

              new_block = render_sections(new_sections, pre_heading_lines)
              updated_content = prefix + start_marker + '\n' + new_block + end_marker + suffix
 
              if updated_content != content:
                  with open(readme_path, 'w', encoding='utf-8') as f:
                      f.write(updated_content)
                  print(f'Updated {readme_path} changelog with {len(new_entries)} author(s).')
              else:
                  print(f'{readme_path} changelog already up to date.')
          EOF

      - name: Commit and push changelog update if needed
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add README.md README-EN.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: auto-update changelog entries for modified author folders'
            git pull --rebase origin main
            git push --force-with-lease origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}