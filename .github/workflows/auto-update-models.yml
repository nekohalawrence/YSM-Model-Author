name: Auto Update Models Information

concurrency:
  group: readme-auto-updates-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - 'Models/**'
      - 'Blockbench-Models/**'
      - 'Other-YSM-Models/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install openai

      # 1. 重建集中作者数据 authors.json（供后续脚本统一读取）
      - name: Step 1 - Build Authors Index
        run: python .github/scripts/build_authors_index.py

      # 2. 自动生成各个模型的 preview README和模型信息
      - name: Step 2 - Generate Model READMEs
        run: python .github/scripts/generate_model_readmes.py

      # 3. 自动更新主 README 中的作者列表与模型统计
      - name: Step 3 - Auto Update Authors List
        run: python .github/scripts/build_readme_authors.py

      # 4. 翻译 README.md (会自动将你在 README.md 中写的手动日志翻译并同步至 README-EN.md)
      - name: Step 4 - Translate full README to README-EN.md
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python .github/scripts/translate_readme.py

      # 5. 统一提交推送
      - name: Commit and push all changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update readmes, authors list, and EN translation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}