name: Auto Update Models Information

concurrency:
  group: readme-auto-updates-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - 'Models/**'
      - 'Blockbench-Models/**'
      - 'Other-YSM-Models/**'
      - 'README.md'
      - '_Model-Inbox/**'          # 推送新模型到 _Model-Inbox 时也触发（Step 0 归档）
  workflow_dispatch:

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install openai

      # 0. 由 pipeline.py 编排全部脚本：
      #    - 若 _Model-Inbox 有新 .ysm：先归档（organize_models --apply），再全套刷新
      #    - 否则：全套刷新（作者数据 → 模型 README → 作者表 → 翻译）
      #    organize_models 只归档（默认不联动），后续步骤由 pipeline 顺序执行；
      #    文件夹重命名不在自动流程内（需人工 review，可手动跑 pipeline rename）。
      - name: Step 0 - Organize inbox and refresh all
        run: |
          if find _Model-Inbox -name '*.ysm' -print -quit | grep -q .; then
            python .github/scripts/pipeline.py inbox
          else
            python .github/scripts/pipeline.py full
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 1. 统一提交推送
      - name: Commit and push all changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update readmes, authors list, and EN translation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
