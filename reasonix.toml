allow = ["Bash=$targets = @(\n  \"Models\\0004\\README.md\",\n  \"Models\\0005\\AK_天狼星_Sirius_LA\\README.md\",\n  \"Models\\0015\\AK_临光\\README.md\",\n  \"Models\\0129\\README.md\",\n  \"Models\\0136\\README.md\",\n  \"Models\\0149\\README.md\"\n)\nforeach ($t in $targets) {\n  Write-Output \"===== $t =====\"\n  Get-Content -LiteralPath $t -ErrorAction SilentlyContinue | Select-Object -First 30\n  Write-Output \"\"\n}", "Bash=[Console]::OutputEncoding = [System.Text.Encoding]::UTF8\nforeach ($t in @(\"Models\\0007\\README.md\",\"Models\\0015\\README.md\",\"Models\\0080\\README.md\",\"Models\\0136\\README.md\",\"Models\\0149\\README.md\",\"Models\\0142\\README.md\",\"Models\\0185\\README.md\")) {\n  Write-Output \"===== $t =====\"\n  [System.IO.File]::ReadAllText((Join-Path (Get-Location) $t), [System.Text.Encoding]::UTF8)\n  Write-Output \"\"\n}", "Bash=python -c @'\nimport io, sys, importlib.util\nfrom pathlib import Path\n\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8', errors='replace')\n\nspec = importlib.util.spec_from_file_location('uar', '.github/scripts/update_author_readme.py')\nuar = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(uar)\n\n# 拦截写文件,改为收集\nwritten = []\norig_write = Path.write_text\ndef fake_write(self, data, *a, **k):\n    written.append((str(self), data))\nPath.write_text = fake_write\n\ntry:\n    uar.process_all_authors()\n    print('batch 正常完成')\nexcept Exception as e:\n    print(f'batch 崩溃: {type(e).__name__}: {e}')\n\nprint(f'实际写回文件数: {len(written)}')\n# 抽样看一个被写回文件的差异摘要\nif written:\n    p, data = written[0]\n    old = Path(p).read_text(encoding='utf-8', errors='ignore')\n    if old != data:\n        print(f'--- 示例差异 {p} ---')\n        import difflib\n        for line in list(difflib.unified_diff(old.splitlines(), data.splitlines(), lineterm=''))[:40]:\n            print(line)\n'@", "Bash=python -c @'\nimport io, sys, importlib.util, difflib\nfrom pathlib import Path\n\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8', errors='replace')\n\nspec = importlib.util.spec_from_file_location('uar', '.github/scripts/update_author_readme.py')\nuar = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(uar)\n\nfor target in ['Models/0001/README.md', 'Models/0000/README.md']:\n    p = Path(target)\n    old = p.read_text(encoding='utf-8', errors='ignore')\n    new, changed = uar.reformat_author_section(old, p)\n    print(f'=== {target}  changed={changed} ===')\n    if changed:\n        for line in list(difflib.unified_diff(old.splitlines(), new.splitlines(), lineterm='', n=2))[:60]:\n            print(repr(line) if line.startswith(('+','-')) else line)\n    else:\n        print('(无变化)')\n'@"]
