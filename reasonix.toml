allow = ["Bash=$targets = @(\n  \"Models\\0004\\README.md\",\n  \"Models\\0005\\AK_天狼星_Sirius_LA\\README.md\",\n  \"Models\\0015\\AK_临光\\README.md\",\n  \"Models\\0129\\README.md\",\n  \"Models\\0136\\README.md\",\n  \"Models\\0149\\README.md\"\n)\nforeach ($t in $targets) {\n  Write-Output \"===== $t =====\"\n  Get-Content -LiteralPath $t -ErrorAction SilentlyContinue | Select-Object -First 30\n  Write-Output \"\"\n}", "Bash=[Console]::OutputEncoding = [System.Text.Encoding]::UTF8\nforeach ($t in @(\"Models\\0007\\README.md\",\"Models\\0015\\README.md\",\"Models\\0080\\README.md\",\"Models\\0136\\README.md\",\"Models\\0149\\README.md\",\"Models\\0142\\README.md\",\"Models\\0185\\README.md\")) {\n  Write-Output \"===== $t =====\"\n  [System.IO.File]::ReadAllText((Join-Path (Get-Location) $t), [System.Text.Encoding]::UTF8)\n  Write-Output \"\"\n}", "Bash=python -c @'\nimport io, sys, importlib.util\nfrom pathlib import Path\n\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8', errors='replace')\n\nspec = importlib.util.spec_from_file_location('uar', '.github/scripts/update_author_readme.py')\nuar = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(uar)\n\n# 拦截写文件,改为收集\nwritten = []\norig_write = Path.write_text\ndef fake_write(self, data, *a, **k):\n    written.append((str(self), data))\nPath.write_text = fake_write\n\ntry:\n    uar.process_all_authors()\n    print('batch 正常完成')\nexcept Exception as e:\n    print(f'batch 崩溃: {type(e).__name__}: {e}')\n\nprint(f'实际写回文件数: {len(written)}')\n# 抽样看一个被写回文件的差异摘要\nif written:\n    p, data = written[0]\n    old = Path(p).read_text(encoding='utf-8', errors='ignore')\n    if old != data:\n        print(f'--- 示例差异 {p} ---')\n        import difflib\n        for line in list(difflib.unified_diff(old.splitlines(), data.splitlines(), lineterm=''))[:40]:\n            print(line)\n'@", "Bash=python -c @'\nimport io, sys, importlib.util, difflib\nfrom pathlib import Path\n\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8', errors='replace')\n\nspec = importlib.util.spec_from_file_location('uar', '.github/scripts/update_author_readme.py')\nuar = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(uar)\n\nfor target in ['Models/0001/README.md', 'Models/0000/README.md']:\n    p = Path(target)\n    old = p.read_text(encoding='utf-8', errors='ignore')\n    new, changed = uar.reformat_author_section(old, p)\n    print(f'=== {target}  changed={changed} ===')\n    if changed:\n        for line in list(difflib.unified_diff(old.splitlines(), new.splitlines(), lineterm='', n=2))[:60]:\n            print(repr(line) if line.startswith(('+','-')) else line)\n    else:\n        print('(无变化)')\n'@", "Bash=Get-Content \"$env:TEMP\\py_db3.txt\" -Encoding UTF8 | Select-Object -Last 4; \"=== 最新报告 ===\"; $f = Get-ChildItem \"$env:TEMP\\ysm-rename-report-*.txt\" | Sort-Object LastWriteTime | Select-Object -Last 1 -ExpandProperty FullName; \"报告: $f\"; Select-String -Path $f -Pattern \"初音未来|0022\" | Select-Object -First 5 | ForEach-Object { $_.Line }", "Bash=$env:PYTHONIOENCODING='utf-8'; python -m py_compile .github/scripts/organize_previews.py; if ($?) { Write-Output \"== py_compile OK ==\" }; python .github/scripts/organize_previews.py --only \"Models/0043/OC_酒狐-宇航员\"; Write-Output \"`n---- rename dry-run ----\"; python .github/scripts/organize_previews.py --rename --only \"Models/0043/OC_酒狐-宇航员\"", "Bash=Get-Item \"_Model-Inbox\\兔子洞.ysm\" | Select-Object Name, Length, LastWriteTime; $bytes = [System.IO.File]::ReadAllBytes(\"_Model-Inbox\\兔子洞.ysm\"); \"前16字节(hex): \" + (($bytes[0..15] | ForEach-Object { $_.ToString(\"X2\") }) -join \" \"); \"前64字节(ASCII): \" + [System.Text.Encoding]::ASCII.GetString($bytes[0..63])", "Bash=Get-ChildItem -Directory | Select-Object Name; Write-Output \"===== _Model-Inbox =====\"; Get-ChildItem _Model-Inbox -ErrorAction SilentlyContinue | Select-Object -First 8 Name, Length; Write-Output \"===== Skins 数量 =====\"; (Get-ChildItem Skins -ErrorAction SilentlyContinue -Recurse -File | Measure-Object).Count; Write-Output \"===== Blockbench-Models =====\"; Get-ChildItem Blockbench-Models -ErrorAction SilentlyContinue | Select-Object -First 5 Name; Write-Output \"===== TACZ / TLM =====\"; Get-ChildItem TACZ-Gun-Packs, TLM-Maid-Packs -ErrorAction SilentlyContinue | Select-Object Name", "Bash=Get-ChildItem .github/scripts/*.py | ForEach-Object { $first = (Get-Content $_.FullName -Encoding UTF8 -TotalCount 30 | Where-Object { $_ -match '^\"\"\"|用途|用法|Usage|Description' } | Select-Object -First 3) -join ' | '; Write-Output (\"{0}: {1}\" -f $_.Name, $first) }", "Bash=$ok = $true; Get-ChildItem .github\\scripts -Filter *.py | Where-Object { $_.Name -ne 'kb_tool.py' } | ForEach-Object { python -m py_compile $_.FullName 2>$null; if ($LASTEXITCODE -ne 0) { $ok = $false; Write-Output \"FAIL: $($_.Name)\" } }; if ($ok) { Write-Output '10 个脚本编译全部通过' }", "Bash=$files = Get-ChildItem -Path \".github/data/knowledge/roles\" -Filter *.json; $empty = 0; $one = 0; foreach ($f in $files) { $j = Get-Content -Raw -Encoding UTF8 $f.FullName | ConvertFrom-Json; if ($j.Count -eq 0) { $empty++ } elseif ($j.Count -eq 1) { $one++ } }; Write-Host \"总文件数: $($files.Count)\"; Write-Host \"空数组文件数: $empty\"; Write-Host \"仅1条记录文件数: $one\"; Write-Host \"--- 空数组文件列表 ---\"; foreach ($f in $files) { $j = Get-Content -Raw -Encoding UTF8 $f.FullName | ConvertFrom-Json; if ($j.Count -eq 0) { Write-Host $f.Name } }", "Bash=Get-ChildItem -Path \".github/scripts\" -Recurse -Filter \"*.py\" | Select-Object FullName, @{N='Lines';E={(Get-Content $_.FullName).Count}} | Sort-Object FullName | Format-Table -AutoSize"]
